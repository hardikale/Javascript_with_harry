<!-- there are 2 ways, using: className and classList
we will use classList since it is mordern and safe.
className change whole, while classList just modifies -->

<html>
    <body>
        <button id="mybtn" class="active btn large">Click me</button>
    
    <script>
        let button = document.getElementById('mybtn')
        
        console.log(button.outerHTML + " = original")

        button.classList.add('color-solid')
        console.log(button.outerHTML + " = add")

        button.classList.remove('color-solid')
        console.log(button.outerHTML + " = remove")

        button.classList.toggle('active')
        console.log(button.outerHTML + " = toggle")

        button.classList.replace('large','small')
        console.log(button.outerHTML + " = replace")

        let check = button.classList.contains('active')
        if (check = true) {
            console.log("it has class called active = contains")
        }else{
            console.log("it donot have class called active = constains")
        }
    </script>
    </body>
</html>
