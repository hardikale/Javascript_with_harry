<style>
    .bulbContainer{
        height: 200px;
        width: 200px;
        background-color: rgb(95, 94, 94);
    }

    .bulbOff{
        background-color: yellow;
    }

    #bulb{
        margin: 10px;
        border-radius: 30%;
    }

    #toggleBtn{
        color: white;
        border-radius: 10px;
        font-weight: bold;
        width:100px;
        height: 40px;
        background-color: #653c20;
    }
    body{
        background-color: #013f75;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
    }
</style>
<body>
    <div id="bulb" class="bulbContainer bulbOff"></div>
    <br><br>
    <button id="toggleBtn">Stop Bulb</button>
</body>

<script>

    const bulb = document.getElementById('bulb');
    const toggleBtn = document.getElementById('toggleBtn');
    let intervalId = null;

    function startBulb(){
        if(intervalId === null){
            intervalId= setInterval(() => {
               bulb.classList.toggle('bulbOff');
            },200);
            toggleBtn.textContent = 'Stop Bulb';
        }
    }

    function stopBulb(){
        if(intervalId !== null){
            clearInterval(intervalId);
            intervalId = null;
            bulb.classList.add('bulbOff')
            toggleBtn.textContent = 'Start Bulb';
        }
    }
    
    toggleBtn.addEventListener('click',function(){
        if(intervalId === null){
            startBulb();
        }else{
            stopBulb();
        }
    })
    startBulb();
</script>
